<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube RAG Chatbot</title>
  <style>
    :root {
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #fafafa;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --text-muted: #6b7280;
      --error: #dc2626;
      --error-bg: #fef2f2;
      --success: #059669;
      --success-bg: #d1fae5;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      line-height: 1.5;
    }
    .container { max-width: 720px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 28px; }
    h1 { font-size: 26px; margin: 0 0 6px; }
    .tagline { color: var(--text-muted); font-size: 14px; margin: 0; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 8px;
      color: var(--text);
    }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: white;
      resize: vertical;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    textarea { min-height: 80px; }
    .thumb {
      margin-top: 12px;
      border-radius: 8px;
      max-width: 100%;
      display: none;
    }
    button {
      width: 100%;
      padding: 12px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .answer { white-space: pre-wrap; line-height: 1.6; font-size: 15px; }
    .meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
    }
    .badge {
      padding: 2px 8px;
      border-radius: 4px;
      background: #f3f4f6;
      font-size: 12px;
    }
    .badge.success { background: var(--success-bg); color: var(--success); }
    .error {
      color: var(--error);
      padding: 12px;
      background: var(--error-bg);
      border-radius: 8px;
      font-size: 14px;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      padding: 20px 12px;
    }
    footer {
      text-align: center;
      margin-top: 28px;
      font-size: 13px;
      color: var(--text-muted);
    }
    footer a { color: var(--accent); text-decoration: none; }
    .hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>YouTube RAG Chatbot</h1>
      <p class="tagline">Ask questions about any YouTube video — answers grounded in its transcript.</p>
    </header>

    <div class="card">
      <label for="videoId">YouTube video URL or ID</label>
      <input id="videoId" type="text" placeholder="https://youtu.be/J5_-l7WIO_w  or just  J5_-l7WIO_w" />
      <img id="thumb" class="thumb" alt="" />
    </div>

    <div class="card">
      <label for="question">Your question</label>
      <textarea id="question" placeholder="What is RAG and why is it useful?"></textarea>
      <div class="hint">Press Ctrl/Cmd + Enter to submit</div>
    </div>

    <button id="askBtn">Ask</button>

    <div class="card" style="margin-top: 14px;">
      <label>Answer</label>
      <div id="answerArea">
        <div class="empty">Your answer will appear here.</div>
      </div>
    </div>

    <footer>
      Built with FastAPI · LangChain · OpenAI · FAISS · <a href="/docs">API docs</a>
    </footer>
  </div>

  <script>
    const videoIdInput = document.getElementById('videoId');
    const questionInput = document.getElementById('question');
    const askBtn = document.getElementById('askBtn');
    const answerArea = document.getElementById('answerArea');
    const thumb = document.getElementById('thumb');

    function extractVideoId(input) {
      const trimmed = (input || '').trim();
      if (!trimmed) return '';
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
        /^([a-zA-Z0-9_-]{11})$/,
      ];
      for (const p of patterns) {
        const m = trimmed.match(p);
        if (m) return m[1];
      }
      return trimmed;
    }

    videoIdInput.addEventListener('input', () => {
      const id = extractVideoId(videoIdInput.value);
      if (id && /^[a-zA-Z0-9_-]{11}$/.test(id)) {
        thumb.src = `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
        thumb.style.display = 'block';
      } else {
        thumb.style.display = 'none';
      }
    });

    async function ask() {
      const videoId = extractVideoId(videoIdInput.value);
      const question = questionInput.value.trim();

      if (!videoId) {
        answerArea.innerHTML = '<div class="error">Please enter a YouTube URL or video ID.</div>';
        return;
      }
      if (!question) {
        answerArea.innerHTML = '<div class="error">Please enter a question.</div>';
        return;
      }

      askBtn.disabled = true;
      askBtn.innerHTML = '<span class="spinner"></span>Thinking...';
      answerArea.innerHTML = '<div class="empty">Fetching transcript and generating answer...<br><small>First call on a new video takes ~10s; cached calls ~2s.</small></div>';

      try {
        const r = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ video_id: videoId, question: question }),
        });

        if (!r.ok) {
          const err = await r.json().catch(() => ({ detail: `HTTP ${r.status}` }));
          throw new Error(err.detail || `HTTP ${r.status}`);
        }

        const data = await r.json();
        const cacheBadge = data.cache_hit
          ? '<span class="badge success">cache hit</span>'
          : '<span class="badge">first call</span>';

        answerArea.innerHTML = `
          <div class="answer"></div>
          <div class="meta">
            <span>${data.latency_seconds}s</span>
            ${cacheBadge}
            <span>video: ${data.video_id}</span>
          </div>
        `;
        // Set as text to avoid HTML injection from model output
        answerArea.querySelector('.answer').textContent = data.answer;
      } catch (e) {
        answerArea.innerHTML = `<div class="error">Error: ${e.message}</div>`;
      } finally {
        askBtn.disabled = false;
        askBtn.textContent = 'Ask';
      }
    }

    askBtn.addEventListener('click', ask);
    questionInput.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') ask();
    });
  </script>
</body>
</html>
